<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="calc-icon.png">
  <link rel="icon" href="calc-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <button class="history" id="historyBtn" aria-label="History" type="button">
      <svg viewBox="0 0 22.3 16.3" width="22.3" height="16.3" fill="none" stroke="currentColor" stroke-linecap="round">
        <circle cx="1.4" cy="1.4" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="1.4" cy="8.15" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="1.4" cy="14.9" r="1.4" fill="currentColor" stroke="none"/>
        <line x1="6.5" y1="1.4" x2="21.1" y2="1.4" stroke-width="2.4"/>
        <line x1="6.5" y1="8.15" x2="21.1" y2="8.15" stroke-width="2.4"/>
        <line x1="6.5" y1="14.9" x2="21.1" y2="14.9" stroke-width="2.4"/>
      </svg>
    </button>

    <div class="display" id="display">
      <span class="display-text" id="displayText">0</span>
    </div>

    <div class="keypad" id="keypad">
      <button class="key fn" data-key="clear" id="clearKey" type="button">AC</button>
      <button class="key fn" data-key="negate" type="button" aria-label="Plus minus">
        <svg viewBox="0 0 30 30" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="7" y1="3" x2="7" y2="13"/>
          <line x1="2" y1="8" x2="12" y2="8"/>
          <line x1="21.5" y1="1.6" x2="7.5" y2="28.4"/>
          <line x1="19" y1="24" x2="28.5" y2="24"/>
        </svg>
      </button>
      <button class="key fn" data-key="percent" type="button" aria-label="Percent">
        <svg viewBox="0 0 29 30.3" width="29" height="30.3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <ellipse cx="7.6" cy="8" rx="5.6" ry="6.4"/>
          <ellipse cx="21.4" cy="22.3" rx="5.6" ry="6.4"/>
          <line x1="24.4" y1="1.6" x2="4.6" y2="28.7"/>
        </svg>
      </button>
      <button class="key op" data-key="/" type="button" aria-label="Divide">
        <svg viewBox="0 0 31 27.7" width="31" height="27.7" fill="currentColor" stroke="currentColor" stroke-linecap="round">
          <circle cx="15.5" cy="2.7" r="2.7" stroke="none"/>
          <circle cx="15.5" cy="25" r="2.7" stroke="none"/>
          <line x1="1.65" y1="13.85" x2="29.35" y2="13.85" stroke-width="3.3"/>
        </svg>
      </button>

      <button class="key num" data-key="7" type="button">7</button>
      <button class="key num" data-key="8" type="button">8</button>
      <button class="key num" data-key="9" type="button">9</button>
      <button class="key op" data-key="*" type="button" aria-label="Multiply">
        <svg viewBox="0 0 25 25" width="25" height="25" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round">
          <line x1="1.65" y1="1.65" x2="23.35" y2="23.35"/>
          <line x1="23.35" y1="1.65" x2="1.65" y2="23.35"/>
        </svg>
      </button>

      <button class="key num" data-key="4" type="button">4</button>
      <button class="key num" data-key="5" type="button">5</button>
      <button class="key num" data-key="6" type="button">6</button>
      <button class="key op" data-key="-" type="button" aria-label="Subtract">
        <svg viewBox="0 0 31 31" width="31" height="31" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round">
          <line x1="1.65" y1="15.5" x2="29.35" y2="15.5"/>
        </svg>
      </button>

      <button class="key num" data-key="1" type="button">1</button>
      <button class="key num" data-key="2" type="button">2</button>
      <button class="key num" data-key="3" type="button">3</button>
      <button class="key op" data-key="+" type="button" aria-label="Add">
        <svg viewBox="0 0 31 31" width="31" height="31" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round">
          <line x1="1.65" y1="15.5" x2="29.35" y2="15.5"/>
          <line x1="15.5" y1="1.65" x2="15.5" y2="29.35"/>
        </svg>
      </button>

      <button class="key num" data-key="mode" type="button" aria-label="Calculator mode">
        <svg viewBox="0 0 26.7 38.7" width="26.7" height="38.7">
          <mask id="calcMask">
            <rect x="0" y="0" width="26.7" height="38.7" rx="5.5" fill="#fff"/>
            <rect x="4.2" y="4.6" width="18.3" height="8.4" rx="2" fill="#000"/>
            <g fill="#000">
              <circle cx="7.1" cy="19.2" r="2.1"/><circle cx="13.35" cy="19.2" r="2.1"/><circle cx="19.6" cy="19.2" r="2.1"/>
              <circle cx="7.1" cy="26.2" r="2.1"/><circle cx="13.35" cy="26.2" r="2.1"/><circle cx="19.6" cy="26.2" r="2.1"/>
              <circle cx="7.1" cy="33.2" r="2.1"/><circle cx="13.35" cy="33.2" r="2.1"/><circle cx="19.6" cy="33.2" r="2.1"/>
            </g>
          </mask>
          <rect x="0" y="0" width="26.7" height="38.7" rx="5.5" fill="currentColor" mask="url(#calcMask)"/>
        </svg>
      </button>
      <button class="key num" data-key="0" type="button">0</button>
      <button class="key num" data-key="." type="button">.</button>
      <button class="key op" data-key="=" type="button" aria-label="Equals">
        <svg viewBox="0 0 26 15.3" width="26" height="15.3" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round">
          <line x1="1.65" y1="1.65" x2="24.35" y2="1.65"/>
          <line x1="1.65" y1="13.65" x2="24.35" y2="13.65"/>
        </svg>
      </button>
    </div>

    <div class="set-dot" id="setDot" aria-hidden="true"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
